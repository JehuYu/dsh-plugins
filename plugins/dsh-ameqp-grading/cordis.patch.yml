# dsh-ameqp-grading bundle patch.
#
# AI 阅卷工作台：连接 AMEQP 账号，选择考试/科目/题目，配置本题标准与视觉模型，
# 逐份评分。模型来源可选「DSH 当前模型」（走 Harness llm，无额外 Key）或
# 「兼容 Chat Completions 的 API」（自定义 base_url）。
#
# 默认只读（不领卷、不锁卷、不回写），用于本地校验与测试。
# 最终正式阅卷时把 productionMarking 设为 true，即打通领卷(GetQuestion)、
# 提交评分(SubmitScore)、取消领卷(GetCancel) 三个写接口。
- insert:
    - id: ameqp-grading
      name: '@local/dsh-ameqp-grading'
      config:
        # AMEQP 站点根
        ameqpBase: 'https://example.invalid/AMEQP/'
        # 安装后填写自己的站点；考试和科目由账号可见列表选择
        examId: null
        subjectId: null
        # 正式阅卷开关：false=只读测试；true=允许领卷/提交/取消（会写回正式系统）
        productionMarking: false
        # 每批最多评多少份；到达上限暂停，可继续下一批，累计计数保留
        autoMaxPapers: 200
        # 全部账号共享的模型请求并发数；同一Provider默认最多2路
        maxConcurrentModels: 2
        # 可按实际Provider限流覆盖，如 { workbuddy: 1 }
        providerConcurrency: {}
